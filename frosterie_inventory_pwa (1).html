<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frosterie Stock">
<meta name="theme-color" content="#0A1628">
<title>Frosterie Stock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#0A1628;--gold:#C9A84C;--white:#fff;--off:#F8F6F0;
  --border:#E0DBCE;--text:#1A1A1A;--mid:#555;--light:#888;
  --green:#2E6B1A;--green-bg:#E8F5E2;--amber:#7A4F0A;--amber-bg:#FDF0D5;
  --red:#7A1F1F;--red-bg:#FDEAEA;--blue:#1A3A6B;--blue-bg:#E2EAF8;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--off);color:var(--text);min-height:100vh;padding-bottom:120px;}
header{background:var(--navy);padding:14px 16px 12px;position:sticky;top:0;z-index:50;border-bottom:2px solid var(--gold);}
.brand{font-size:1.3rem;font-weight:700;color:var(--gold);letter-spacing:0.12em;}
.sub{font-size:0.58rem;color:rgba(255,255,255,0.4);letter-spacing:0.18em;text-transform:uppercase;margin-top:2px;}

/* TABS */
.tabs{display:flex;background:var(--navy);border-bottom:1px solid rgba(201,168,76,0.2);position:sticky;top:56px;z-index:49;}
.tab{flex:1;padding:10px 4px;font-size:0.68rem;font-weight:600;color:rgba(255,255,255,0.45);border:none;background:none;cursor:pointer;letter-spacing:0.05em;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

.container{max-width:680px;margin:0 auto;padding:12px;}
.page{display:none;}.page.active{display:block;}

/* SUMMARY CARDS */
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat{background:white;border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.stat-label{font-size:0.6rem;color:var(--light);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px;}
.stat-val{font-size:1.2rem;font-weight:700;color:var(--navy);}
.stat-sub{font-size:0.6rem;color:var(--light);}
.profit-pos{color:var(--green);}
.profit-neg{color:var(--red);}

/* PRODUCT CARDS */
.prod-card{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;}
.prod-stripe{height:3px;}
.prod-stripe.ok{background:var(--green);}
.prod-stripe.warn{background:#EF9F27;}
.prod-stripe.low{background:#E24B4A;}
.prod-header{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
.prod-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.prod-name{font-size:1rem;font-weight:700;color:var(--navy);}
.badge{font-size:0.58rem;padding:2px 8px;border-radius:12px;font-weight:600;}
.badge.ok{background:var(--green-bg);color:var(--green);}
.badge.warn{background:var(--amber-bg);color:var(--amber);}
.badge.low{background:var(--red-bg);color:var(--red);}

/* STOCK SECTIONS */
.stock-section{padding:8px 12px;border-bottom:1px solid var(--border);}
.stock-section:last-child{border-bottom:none;}
.section-label{font-size:0.6rem;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.section-label .dot{width:6px;height:6px;border-radius:50%;}
.dot-carton{background:#0A1628;}
.dot-bag{background:#C9A84C;}
.dot-pack{background:#639922;}

.stock-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;gap:8px;}
.stock-info{flex:1;}
.stock-name{font-size:0.78rem;font-weight:600;color:var(--navy);}
.stock-detail{font-size:0.62rem;color:var(--light);margin-top:1px;}
.stock-nums{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.stock-qty{font-size:1rem;font-weight:700;color:var(--navy);min-width:28px;text-align:center;}
.stock-profit{font-size:0.6rem;font-weight:600;}

/* ACTION BUTTONS */
.prod-actions{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--off);border-top:1px solid var(--border);}
.act-btn{font-size:0.65rem;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:white;cursor:pointer;color:var(--navy);font-family:inherit;white-space:nowrap;}
.act-btn.primary{background:var(--navy);color:var(--gold);border-color:var(--navy);}
.act-btn.convert{background:var(--blue-bg);color:var(--blue);border-color:#b0c4e8;}
.act-btn.sell{background:var(--red-bg);color:var(--red);border-color:#f0c0c0;}
.act-btn.edit{background:var(--amber-bg);color:var(--amber);border-color:#e8d0a0;}

/* LOG PAGE */
.log-filters{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;}
.filter-btn{font-size:0.65rem;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:white;cursor:pointer;color:var(--mid);white-space:nowrap;font-family:inherit;}
.filter-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy);}
.log-wrap{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.log-item{padding:10px 12px;border-bottom:1px solid var(--border);position:relative;}
.log-item:last-child{border-bottom:none;}
.log-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px;}
.log-desc{font-size:0.75rem;color:var(--text);flex:1;line-height:1.4;}
.log-time{font-size:0.6rem;color:var(--light);white-space:nowrap;}
.log-meta{display:flex;align-items:center;gap:6px;}
.log-type{font-size:0.58rem;font-weight:700;padding:2px 7px;border-radius:10px;}
.lt-restock{background:var(--green-bg);color:var(--green);}
.lt-sale{background:var(--red-bg);color:var(--red);}
.lt-convert{background:var(--blue-bg);color:var(--blue);}
.lt-adjust{background:var(--amber-bg);color:var(--amber);}
.log-profit{font-size:0.65rem;font-weight:700;}
.log-empty{text-align:center;color:var(--light);font-size:0.75rem;padding:2rem;font-style:italic;}
.log-delete{position:absolute;right:10px;bottom:8px;font-size:0.6rem;color:var(--red);background:none;border:none;cursor:pointer;font-family:inherit;opacity:0.7;}

/* PROFIT PAGE */
.profit-card{background:white;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.profit-title{font-size:0.75rem;font-weight:700;color:var(--navy);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.profit-row{display:flex;justify-content:space-between;font-size:0.72rem;padding:3px 0;color:var(--mid);}
.profit-row strong{color:var(--text);}
.profit-total{display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;padding:8px 0 0;border-top:1px solid var(--border);margin-top:4px;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,22,40,0.6);z-index:200;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:white;border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:100%;max-width:500px;max-height:85vh;overflow-y:auto;}
.modal-handle{width:36px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:14px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:0.62rem;color:var(--light);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:0.88rem;color:var(--text);background:white;outline:none;font-family:inherit;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--navy);}
.info-box{background:var(--blue-bg);border-radius:8px;padding:8px 10px;font-size:0.7rem;color:var(--blue);margin-bottom:10px;line-height:1.5;}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
.modal-actions button{flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:1px solid var(--border);font-family:inherit;}
.btn-cancel{background:white;color:var(--mid);}
.btn-confirm{background:var(--navy);color:var(--gold);border-color:var(--navy);}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:#f0c0c0;}

/* FAB */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:16px;background:var(--navy);color:var(--gold);border:none;border-radius:50px;padding:12px 18px;font-size:0.75rem;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(10,22,40,0.3);z-index:40;font-family:inherit;}

/* EXPORT */
.export-btn{width:100%;padding:11px;background:white;border:1px solid var(--border);border-radius:10px;font-size:0.72rem;color:var(--mid);cursor:pointer;font-family:inherit;margin-bottom:10px;font-weight:600;}

.sec-title{font-size:0.68rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--gold);}
.empty-state{text-align:center;color:var(--light);font-size:0.75rem;padding:2rem;font-style:italic;}
</style>
</head>
<body>

<header>
  <div class="brand">FROSTERIE</div>
  <div class="sub">Inventory Tracker v2</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showPage('stock')">Stock</button>
  <button class="tab" onclick="showPage('log')">Log</button>
  <button class="tab" onclick="showPage('profit')">Profit</button>
</div>

<!-- STOCK PAGE -->
<div class="page active" id="page-stock">
  <div class="container">
    <div class="summary" id="summary"></div>
    <div class="sec-title">Croissant Inventory</div>
    <div id="products"></div>
  </div>
</div>

<!-- LOG PAGE -->
<div class="page" id="page-log">
  <div class="container">
    <div class="log-filters" id="log-filters"></div>
    <button class="export-btn" onclick="exportCSV()">Export Log as CSV</button>
    <div class="log-wrap" id="log-list"></div>
  </div>
</div>

<!-- PROFIT PAGE -->
<div class="page" id="page-profit">
  <div class="container">
    <div class="summary" id="profit-summary"></div>
    <div class="sec-title" style="margin-top:12px">Breakdown by Product</div>
    <div id="profit-breakdown"></div>
  </div>
</div>

<button class="fab" onclick="openRestock()">+ Restock</button>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Action</div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
// ─── DATA STRUCTURE ────────────────────────────────────────────────────────
const KS = 'frosterie_v2_stock';
const KL = 'frosterie_v2_log';

const PRODUCTS = [
  {
    id: 'mini', name: 'Mini 30g',
    carton: { pieces: 480, costPrice: 96000, sellPrice: 168000 },
    bags: [
      { id:'mini_bag80', name:'Bag of 80', pieces:80, costPerPiece:400, sellPrice:47500 },
      { id:'mini_bag40', name:'Bag of 40', pieces:40, costPerPiece:400, sellPrice:24000 },
    ],
    packs: [
      { id:'mini_pack25', name:'Pack of 25', pieces:25, costPerPiece:400, sellPrice:15000 },
      { id:'mini_pack20', name:'Pack of 20', pieces:20, costPerPiece:400, sellPrice:12000 },
    ]
  },
  {
    id: 'midi', name: 'Midi 60g',
    carton: { pieces: 192, costPrice: 49000, sellPrice: 72000 },
    bags: [
      { id:'midi_bag35', name:'Bag of 35', pieces:35, costPerPiece:700, sellPrice:52000 },
    ],
    packs: [
      { id:'midi_pack8', name:'Pack of 8', pieces:8, costPerPiece:700, sellPrice:12000 },
      { id:'midi_pack6', name:'Pack of 6', pieces:6, costPerPiece:700, sellPrice:9000 },
    ]
  },
  {
    id: 'maxi', name: 'Maxi 70g',
    carton: { pieces: 120, costPrice: 60000, sellPrice: 80000 },
    bags: [
      { id:'maxi_bag30', name:'Bag of 30', pieces:30, costPerPiece:1000, sellPrice:53000 },
    ],
    packs: [
      { id:'maxi_pack6', name:'Pack of 6', pieces:6, costPerPiece:1000, sellPrice:10600 },
    ]
  },
  {
    id: 'classic', name: 'Classic 80g',
    carton: { pieces: 120, costPrice: 60000, sellPrice: 94000 },
    bags: [
      { id:'classic_bag30', name:'Bag of 30', pieces:30, costPerPiece:1000, sellPrice:65000 },
    ],
    packs: [
      { id:'classic_pack6', name:'Pack of 6', pieces:6, costPerPiece:1000, sellPrice:13000 },
    ]
  }
];

// ─── STATE ──────────────────────────────────────────────────────────────────
function defaultStock() {
  const s = {};
  PRODUCTS.forEach(p => {
    s[p.id] = { cartons: 0 };
    [...p.bags, ...p.packs].forEach(u => { s[p.id][u.id] = 0; });
  });
  // Pre-load known stock
  s.midi['midi_pack6'] = 6;
  s.mini['mini_pack20'] = 2;
  return s;
}

function loadStock() {
  try { const d = localStorage.getItem(KS); return d ? JSON.parse(d) : defaultStock(); }
  catch(e) { return defaultStock(); }
}
function loadLog() {
  try { const d = localStorage.getItem(KL); return d ? JSON.parse(d) : []; }
  catch(e) { return []; }
}
function save() {
  localStorage.setItem(KS, JSON.stringify(stock));
  localStorage.setItem(KL, JSON.stringify(log));
}

let stock = loadStock();
let log = loadLog();
let logFilter = 'all';
let currentPage = 'stock';

// ─── HELPERS ────────────────────────────────────────────────────────────────
function fmt(n) { return '₦' + Number(n).toLocaleString(); }
function now() {
  const d = new Date();
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}) + ' ' +
         d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function uid() { return Date.now() + Math.random().toString(36).slice(2,6); }

function getProd(pid) { return PRODUCTS.find(p => p.id === pid); }
function getUnit(pid, uid_) {
  const p = getProd(pid);
  return [...p.bags, ...p.packs].find(u => u.id === uid_);
}

function totalPieces(pid) {
  const p = getProd(pid); const s = stock[pid];
  let total = s.cartons * p.carton.pieces;
  [...p.bags, ...p.packs].forEach(u => { total += (s[u.id] || 0) * u.pieces; });
  return total;
}

function statusColor(pid) {
  const pieces = totalPieces(pid);
  if (pieces <= 0) return 'low';
  if (pieces < 50) return 'warn';
  return 'ok';
}

function badgeText(pid) {
  const s = statusColor(pid);
  if (s === 'low') return 'Out of stock';
  if (s === 'warn') return 'Low stock';
  return 'In stock';
}

// ─── PROFIT CALCULATIONS ────────────────────────────────────────────────────
function calcProfit() {
  let totalRevenue = 0, totalCost = 0, totalProfit = 0;
  const breakdown = {};
  PRODUCTS.forEach(p => { breakdown[p.id] = {revenue:0, cost:0, profit:0}; });

  log.forEach(e => {
    if (e.type !== 'sale') return;
    const b = breakdown[e.pid];
    if (!b) return;
    b.revenue += e.revenue || 0;
    b.cost += e.cost || 0;
    b.profit += (e.revenue || 0) - (e.cost || 0);
    totalRevenue += e.revenue || 0;
    totalCost += e.cost || 0;
    totalProfit += (e.revenue || 0) - (e.cost || 0);
  });

  return { totalRevenue, totalCost, totalProfit, breakdown };
}

// ─── RENDER STOCK ───────────────────────────────────────────────────────────
function renderSummary() {
  const { totalRevenue, totalCost, totalProfit } = calcProfit();
  let totalPcs = 0;
  PRODUCTS.forEach(p => { totalPcs += totalPieces(p.id); });

  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="stat-label">Total pieces</div><div class="stat-val">${totalPcs}</div><div class="stat-sub">across all sizes</div></div>
    <div class="stat"><div class="stat-label">Total profit</div><div class="stat-val ${totalProfit >= 0 ? 'profit-pos' : 'profit-neg'}">${fmt(totalProfit)}</div><div class="stat-sub">from recorded sales</div></div>
    <div class="stat"><div class="stat-label">Revenue</div><div class="stat-val">${fmt(totalRevenue)}</div><div class="stat-sub">total sold</div></div>
    <div class="stat"><div class="stat-label">Log entries</div><div class="stat-val">${log.length}</div><div class="stat-sub">total activities</div></div>
  `;
}

function renderProducts() {
  const el = document.getElementById('products');
  el.innerHTML = PRODUCTS.map(p => {
    const s = stock[p.id];
    const sc = statusColor(p.id);
    const bt = badgeText(p.id);
    const pieces = totalPieces(p.id);

    // Carton section
    let html = `
      <div class="prod-card">
        <div class="prod-stripe ${sc}"></div>
        <div class="prod-header">
          <div class="prod-title-row">
            <div class="prod-name">${p.name}</div>
            <span class="badge ${sc}">${bt}</span>
          </div>
          <div style="font-size:0.65rem;color:var(--light);margin-top:2px">${pieces} total pieces in stock</div>
        </div>

        <div class="stock-section">
          <div class="section-label"><span class="dot dot-carton"></span>CARTONS</div>
          <div class="stock-row">
            <div class="stock-info">
              <div class="stock-name">Full Carton (${p.carton.pieces} pcs)</div>
              <div class="stock-detail">Cost ${fmt(p.carton.costPrice)} &middot; Sell ${fmt(p.carton.sellPrice)} &middot; Profit ${fmt(p.carton.sellPrice - p.carton.costPrice)}</div>
            </div>
            <div class="stock-nums">
              <div class="stock-qty">${s.cartons}</div>
            </div>
          </div>
        </div>

        <div class="stock-section">
          <div class="section-label"><span class="dot dot-bag"></span>BAGS</div>
          ${p.bags.map(u => `
          <div class="stock-row">
            <div class="stock-info">
              <div class="stock-name">${u.name} (${u.pieces} pcs)</div>
              <div class="stock-detail">Cost ${fmt(u.costPerPiece * u.pieces)} &middot; Sell ${fmt(u.sellPrice)} &middot; Profit ${fmt(u.sellPrice - u.costPerPiece * u.pieces)}</div>
            </div>
            <div class="stock-nums">
              <div class="stock-qty">${s[u.id] || 0}</div>
            </div>
          </div>`).join('')}
        </div>

        <div class="stock-section">
          <div class="section-label"><span class="dot dot-pack"></span>PACKS</div>
          ${p.packs.map(u => `
          <div class="stock-row">
            <div class="stock-info">
              <div class="stock-name">${u.name} (${u.pieces} pcs)</div>
              <div class="stock-detail">Cost ${fmt(u.costPerPiece * u.pieces)} &middot; Sell ${fmt(u.sellPrice)} &middot; Profit ${fmt(u.sellPrice - u.costPerPiece * u.pieces)}</div>
            </div>
            <div class="stock-nums">
              <div class="stock-qty">${s[u.id] || 0}</div>
            </div>
          </div>`).join('')}
        </div>

        <div class="prod-actions">
          <button class="act-btn primary" onclick="openRestock('${p.id}')">+ Restock</button>
          <button class="act-btn sell" onclick="openSale('${p.id}')">Record Sale</button>
          <button class="act-btn convert" onclick="openConvert('${p.id}')">Convert</button>
          <button class="act-btn edit" onclick="openEdit('${p.id}')">Edit Stock</button>
        </div>
      </div>
    `;
    return html;
  }).join('');
}

function render() { renderSummary(); renderProducts(); renderProfitPage(); renderLog(); }

// ─── MODAL HELPERS ──────────────────────────────────────────────────────────
function openModal(title, bodyHTML, actions) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
document.getElementById('modal-bg').addEventListener('click', e => { if(e.target.id==='modal-bg') closeModal(); });

// ─── RESTOCK ────────────────────────────────────────────────────────────────
function openRestock(pid) {
  const prodOptions = PRODUCTS.map(p => `<option value="${p.id}" ${p.id===pid?'selected':''}>${p.name}</option>`).join('');
  openModal('+ Restock Stock',
    `<div class="field"><label>Product</label><select id="m-pid" onchange="updateRestockUnits()">${prodOptions}</select></div>
     <div class="field"><label>Type</label><select id="m-type" onchange="updateRestockUnits()">
       <option value="carton">Carton</option>
       <option value="bag">Bag</option>
       <option value="pack">Pack</option>
     </select></div>
     <div class="field" id="m-unit-field" style="display:none"><label>Unit</label><select id="m-unit"></select></div>
     <div class="field"><label>Quantity</label><input type="number" id="m-qty" min="1" inputmode="numeric" placeholder="0"></div>
     <div class="field"><label>Note (optional)</label><input type="text" id="m-note" placeholder="e.g. Tuesday delivery"></div>`,
    `<button class="modal-actions btn-cancel" style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:white;color:var(--mid);font-family:inherit" onclick="closeModal()">Cancel</button>
     <button class="modal-actions btn-confirm" style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;background:var(--navy);color:var(--gold);font-family:inherit" onclick="submitRestock()">Confirm</button>`
  );
  updateRestockUnits();
}

function updateRestockUnits() {
  const pid = document.getElementById('m-pid').value;
  const type = document.getElementById('m-type').value;
  const p = getProd(pid);
  const unitField = document.getElementById('m-unit-field');
  const unitSel = document.getElementById('m-unit');

  if (type === 'carton') { unitField.style.display = 'none'; return; }
  unitField.style.display = 'block';
  const units = type === 'bag' ? p.bags : p.packs;
  unitSel.innerHTML = units.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
}

function submitRestock() {
  const pid = document.getElementById('m-pid').value;
  const type = document.getElementById('m-type').value;
  const qty = parseInt(document.getElementById('m-qty').value);
  const note = document.getElementById('m-note').value.trim();
  if (!qty || qty < 1) { alert('Enter a valid quantity.'); return; }

  const p = getProd(pid);
  let desc, key, pieces;

  if (type === 'carton') {
    stock[pid].cartons += qty;
    desc = `${qty} carton${qty>1?'s':''} of ${p.name}`;
    pieces = qty * p.carton.pieces;
    key = 'carton';
  } else {
    const uid_ = document.getElementById('m-unit').value;
    const u = getUnit(pid, uid_);
    stock[pid][uid_] = (stock[pid][uid_] || 0) + qty;
    desc = `${qty} × ${u.name} of ${p.name}`;
    pieces = qty * u.pieces;
    key = uid_;
  }

  log.push({ id:uid(), type:'restock', pid, key, qty, pieces, desc, note, time:now() });
  save(); closeModal(); render();
}

// ─── SALE ───────────────────────────────────────────────────────────────────
function openSale(pid) {
  const prodOptions = PRODUCTS.map(p => `<option value="${p.id}" ${p.id===pid?'selected':''}>${p.name}</option>`).join('');
  openModal('Record a Sale',
    `<div class="field"><label>Product</label><select id="m-pid" onchange="updateSaleUnits()">${prodOptions}</select></div>
     <div class="field"><label>Type</label><select id="m-type" onchange="updateSaleUnits()">
       <option value="carton">Carton</option>
       <option value="bag">Bag</option>
       <option value="pack">Pack</option>
     </select></div>
     <div class="field" id="m-unit-field" style="display:none"><label>Unit</label><select id="m-unit" onchange="updateSalePrices()"></select></div>
     <div class="field"><label>Quantity sold</label><input type="number" id="m-qty" min="1" inputmode="numeric" placeholder="0" oninput="updateSalePrices()"></div>
     <div id="m-price-info" class="info-box" style="display:none"></div>
     <div class="field"><label>Note (optional)</label><input type="text" id="m-note" placeholder="e.g. Customer order"></div>`,
    `<button style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:white;color:var(--mid);font-family:inherit" onclick="closeModal()">Cancel</button>
     <button style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;background:var(--navy);color:var(--gold);font-family:inherit" onclick="submitSale()">Confirm</button>`
  );
  updateSaleUnits();
}

function updateSaleUnits() {
  const pid = document.getElementById('m-pid').value;
  const type = document.getElementById('m-type').value;
  const p = getProd(pid);
  const unitField = document.getElementById('m-unit-field');
  const unitSel = document.getElementById('m-unit');
  if (type === 'carton') { unitField.style.display='none'; updateSalePrices(); return; }
  unitField.style.display = 'block';
  const units = type === 'bag' ? p.bags : p.packs;
  unitSel.innerHTML = units.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
  updateSalePrices();
}

function updateSalePrices() {
  const pid = document.getElementById('m-pid').value;
  const type = document.getElementById('m-type').value;
  const qty = parseInt(document.getElementById('m-qty').value) || 0;
  const p = getProd(pid);
  const infoBox = document.getElementById('m-price-info');

  let sellPrice, costPrice, pieces;
  if (type === 'carton') {
    sellPrice = p.carton.sellPrice; costPrice = p.carton.costPrice; pieces = p.carton.pieces;
  } else {
    const uid_ = document.getElementById('m-unit')?.value;
    if (!uid_) return;
    const u = getUnit(pid, uid_);
    sellPrice = u.sellPrice; costPrice = u.costPerPiece * u.pieces; pieces = u.pieces;
  }

  if (qty > 0) {
    const totalSell = qty * sellPrice;
    const totalCost = qty * costPrice;
    const profit = totalSell - totalCost;
    infoBox.style.display = 'block';
    infoBox.innerHTML = `Revenue: <strong>${fmt(totalSell)}</strong> &nbsp;|&nbsp; Cost: <strong>${fmt(totalCost)}</strong> &nbsp;|&nbsp; Profit: <strong style="color:${profit>=0?'var(--green)':'var(--red)'}">${fmt(profit)}</strong>`;
  } else {
    infoBox.style.display = 'none';
  }
}

function submitSale() {
  const pid = document.getElementById('m-pid').value;
  const type = document.getElementById('m-type').value;
  const qty = parseInt(document.getElementById('m-qty').value);
  const note = document.getElementById('m-note').value.trim();
  if (!qty || qty < 1) { alert('Enter a valid quantity.'); return; }

  const p = getProd(pid);
  let desc, key, sellPrice, costPrice, pieces, uid_;

  if (type === 'carton') {
    if (stock[pid].cartons < qty) { alert(`Only ${stock[pid].cartons} carton(s) in stock.`); return; }
    stock[pid].cartons -= qty;
    sellPrice = p.carton.sellPrice; costPrice = p.carton.costPrice; pieces = p.carton.pieces;
    desc = `${qty} carton${qty>1?'s':''} of ${p.name}`;
    key = 'carton';
  } else {
    uid_ = document.getElementById('m-unit').value;
    const u = getUnit(pid, uid_);
    const current = stock[pid][uid_] || 0;
    if (current < qty) { alert(`Only ${current} unit(s) of ${u.name} in stock.`); return; }
    stock[pid][uid_] -= qty;
    sellPrice = u.sellPrice; costPrice = u.costPerPiece * u.pieces; pieces = u.pieces;
    desc = `${qty} × ${u.name} of ${p.name}`;
    key = uid_;
  }

  const revenue = qty * sellPrice;
  const cost = qty * costPrice;
  log.push({ id:uid(), type:'sale', pid, key, qty, pieces:qty*pieces, desc, note, revenue, cost, time:now() });
  save(); closeModal(); render();
}

// ─── CONVERT ────────────────────────────────────────────────────────────────
function openConvert(pid) {
  const p = getProd(pid);
  const s = stock[pid];
  const unitOptions = [...p.bags, ...p.packs].map(u => `<option value="${u.id}">${u.name} (${u.pieces} pcs each)</option>`).join('');

  openModal('Convert Carton to Units',
    `<div class="info-box">Converting breaks a carton into bags or packs. Stock is adjusted automatically.</div>
     <div class="field"><label>Product</label><input type="text" value="${p.name}" disabled style="background:var(--off)"></div>
     <div class="field"><label>Cartons available</label><input type="text" value="${s.cartons}" disabled style="background:var(--off)"></div>
     <div class="field"><label>Cartons to convert</label><input type="number" id="m-cartons" min="1" max="${s.cartons}" inputmode="numeric" placeholder="0" oninput="updateConvertCalc('${pid}')"></div>
     <div class="field"><label>Convert into</label><select id="m-unit" onchange="updateConvertCalc('${pid}')">${unitOptions}</select></div>
     <div id="m-convert-info" class="info-box" style="display:none"></div>
     <div class="field"><label>Note (optional)</label><input type="text" id="m-note" placeholder="e.g. Breaking for retail"></div>`,
    `<button style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:white;color:var(--mid);font-family:inherit" onclick="closeModal()">Cancel</button>
     <button style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;background:var(--blue);color:white;font-family:inherit" onclick="submitConvert('${pid}')">Convert</button>`
  );
}

function updateConvertCalc(pid) {
  const p = getProd(pid);
  const cartons = parseInt(document.getElementById('m-cartons').value) || 0;
  const uid_ = document.getElementById('m-unit').value;
  const u = getUnit(pid, uid_);
  const infoBox = document.getElementById('m-convert-info');
  if (cartons > 0 && u) {
    const totalPieces = cartons * p.carton.pieces;
    const units = Math.floor(totalPieces / u.pieces);
    const remainder = totalPieces % u.pieces;
    infoBox.style.display = 'block';
    infoBox.innerHTML = `${cartons} carton${cartons>1?'s':''} (${totalPieces} pcs) → <strong>${units} × ${u.name}</strong>${remainder>0?` + ${remainder} pieces remaining`:''}`;
  } else {
    infoBox.style.display = 'none';
  }
}

function submitConvert(pid) {
  const p = getProd(pid);
  const cartons = parseInt(document.getElementById('m-cartons').value);
  const uid_ = document.getElementById('m-unit').value;
  const note = document.getElementById('m-note').value.trim();
  if (!cartons || cartons < 1) { alert('Enter number of cartons to convert.'); return; }
  if (stock[pid].cartons < cartons) { alert(`Only ${stock[pid].cartons} carton(s) available.`); return; }

  const u = getUnit(pid, uid_);
  const totalPieces = cartons * p.carton.pieces;
  const units = Math.floor(totalPieces / u.pieces);

  stock[pid].cartons -= cartons;
  stock[pid][uid_] = (stock[pid][uid_] || 0) + units;

  const desc = `${cartons} carton${cartons>1?'s':''} of ${p.name} → ${units} × ${u.name}`;
  log.push({ id:uid(), type:'convert', pid, key:uid_, qty:units, pieces:totalPieces, desc, note, time:now() });
  save(); closeModal(); render();
}

// ─── EDIT ───────────────────────────────────────────────────────────────────
function openEdit(pid) {
  const p = getProd(pid);
  const s = stock[pid];
  const rows = [
    `<div class="stock-row" style="padding:6px 0;border-bottom:1px solid var(--border)">
       <div class="stock-info"><div class="stock-name">Cartons</div></div>
       <input type="number" min="0" inputmode="numeric" value="${s.cartons}" id="edit_carton" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;text-align:center;font-family:inherit">
     </div>`,
    ...[...p.bags, ...p.packs].map(u =>
      `<div class="stock-row" style="padding:6px 0;border-bottom:1px solid var(--border)">
         <div class="stock-info"><div class="stock-name">${u.name}</div></div>
         <input type="number" min="0" inputmode="numeric" value="${s[u.id]||0}" id="edit_${u.id}" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;text-align:center;font-family:inherit">
       </div>`
    )
  ].join('');

  openModal(`Edit Stock — ${p.name}`,
    `<div class="info-box">Set the correct stock numbers. Each change is logged.</div>${rows}
     <div class="field" style="margin-top:10px"><label>Reason for edit</label><input type="text" id="m-note" placeholder="e.g. Stock count correction"></div>`,
    `<button style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:white;color:var(--mid);font-family:inherit" onclick="closeModal()">Cancel</button>
     <button style="flex:1;padding:12px;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;background:var(--amber);color:white;font-family:inherit" onclick="submitEdit('${pid}')">Save Changes</button>`
  );
}

function submitEdit(pid) {
  const p = getProd(pid);
  const note = document.getElementById('m-note').value.trim() || 'Manual edit';
  const changes = [];

  const newCartons = parseInt(document.getElementById('edit_carton').value) || 0;
  if (newCartons !== stock[pid].cartons) {
    changes.push(`Cartons: ${stock[pid].cartons} → ${newCartons}`);
    stock[pid].cartons = newCartons;
  }

  [...p.bags, ...p.packs].forEach(u => {
    const el = document.getElementById(`edit_${u.id}`);
    if (!el) return;
    const newVal = parseInt(el.value) || 0;
    const oldVal = stock[pid][u.id] || 0;
    if (newVal !== oldVal) {
      changes.push(`${u.name}: ${oldVal} → ${newVal}`);
      stock[pid][u.id] = newVal;
    }
  });

  if (changes.length === 0) { closeModal(); return; }

  log.push({ id:uid(), type:'adjust', pid, key:'edit', qty:0, pieces:0,
    desc:`Edit ${p.name}: ${changes.join(', ')}`, note, time:now() });
  save(); closeModal(); render();
}

// ─── LOG ────────────────────────────────────────────────────────────────────
function renderLog() {
  const filters = ['all','restock','sale','convert','adjust'];
  document.getElementById('log-filters').innerHTML = filters.map(f =>
    `<button class="filter-btn ${logFilter===f?'active':''}" onclick="setFilter('${f}')">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`
  ).join('');

  const filtered = logFilter === 'all' ? [...log].reverse() : [...log].filter(e=>e.type===logFilter).reverse();
  const el = document.getElementById('log-list');
  if (!filtered.length) { el.innerHTML = `<div class="log-empty">No ${logFilter==='all'?'':logFilter+' '}entries yet.</div>`; return; }

  const typeClass = { restock:'lt-restock', sale:'lt-sale', convert:'lt-convert', adjust:'lt-adjust' };

  el.innerHTML = filtered.map(e => {
    const profitStr = e.type==='sale' ? `<span class="log-profit" style="color:${(e.revenue-e.cost)>=0?'var(--green)':'var(--red)'}">+${fmt(e.revenue-e.cost)}</span>` : '';
    return `<div class="log-item">
      <div class="log-top">
        <div class="log-desc">
          <span class="log-type ${typeClass[e.type]||'lt-adjust'}">${e.type}</span>
          ${e.desc}${e.note?' · <em style="color:var(--light)">' + e.note + '</em>':''}
        </div>
        <div class="log-time">${e.time}</div>
      </div>
      <div class="log-meta">
        ${profitStr}
        ${e.type==='sale'?`<span style="font-size:0.62rem;color:var(--light)">Rev ${fmt(e.revenue)} · Cost ${fmt(e.cost)}</span>`:''}
      </div>
      <button class="log-delete" onclick="deleteLog('${e.id}')">Delete entry</button>
    </div>`;
  }).join('');
}

function setFilter(f) { logFilter = f; renderLog(); }

function deleteLog(eid) {
  if (!confirm('Delete this log entry? Stock levels will not change.')) return;
  log = log.filter(e => e.id !== eid);
  save(); render();
}

// ─── PROFIT PAGE ────────────────────────────────────────────────────────────
function renderProfitPage() {
  const { totalRevenue, totalCost, totalProfit, breakdown } = calcProfit();

  document.getElementById('profit-summary').innerHTML = `
    <div class="stat"><div class="stat-label">Total revenue</div><div class="stat-val">${fmt(totalRevenue)}</div></div>
    <div class="stat"><div class="stat-label">Total cost</div><div class="stat-val">${fmt(totalCost)}</div></div>
    <div class="stat"><div class="stat-label">Gross profit</div><div class="stat-val ${totalProfit>=0?'profit-pos':'profit-neg'}">${fmt(totalProfit)}</div></div>
    <div class="stat"><div class="stat-label">Margin</div><div class="stat-val">${totalRevenue>0?Math.round((totalProfit/totalRevenue)*100):0}%</div></div>
  `;

  document.getElementById('profit-breakdown').innerHTML = PRODUCTS.map(p => {
    const b = breakdown[p.id];
    return `<div class="profit-card">
      <div class="profit-title">${p.name}</div>
      <div class="profit-row"><span>Revenue</span><strong>${fmt(b.revenue)}</strong></div>
      <div class="profit-row"><span>Cost</span><strong>${fmt(b.cost)}</strong></div>
      <div class="profit-total"><span>Profit</span><strong class="${b.profit>=0?'profit-pos':'profit-neg'}">${fmt(b.profit)}</strong></div>
    </div>`;
  }).join('');
}

// ─── EXPORT ─────────────────────────────────────────────────────────────────
function exportCSV() {
  if (!log.length) { alert('No activity to export yet.'); return; }
  const rows = [['Date','Type','Product','Description','Qty','Revenue','Cost','Profit','Note'],
    ...[...log].reverse().map(e => [e.time,e.type,e.pid||'',e.desc||'',e.qty||0,e.revenue||0,e.cost||0,(e.revenue||0)-(e.cost||0),e.note||''])];
  const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'frosterie_log.csv'; a.click();
  URL.revokeObjectURL(a.href);
}

// ─── NAVIGATION ─────────────────────────────────────────────────────────────
function showPage(name) {
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => { if(t.textContent.toLowerCase()===name) t.classList.add('active'); });
  document.querySelector('.fab').style.display = name==='stock' ? 'block' : 'none';
  if (name==='log') renderLog();
  if (name==='profit') renderProfitPage();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
